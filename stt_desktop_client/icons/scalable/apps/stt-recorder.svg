<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#grad1)" stroke="#2C5F8D" stroke-width="2"/>

  <!-- Microphone body -->
  <rect x="26" y="18" width="12" height="20" rx="6" fill="#FFFFFF" stroke="#2C5F8D" stroke-width="1.5"/>

  <!-- Microphone grille lines -->
  <line x1="26" y1="24" x2="38" y2="24" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="26" y1="28" x2="38" y2="28" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="26" y1="32" x2="38" y2="32" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Microphone stand -->
  <path d="M 32 38 L 32 46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="26" y1="46" x2="38" y2="46" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Sound waves -->
  <path d="M 44 26 Q 48 28 48 32 Q 48 36 44 38" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 48 24 Q 54 28 54 32 Q 54 36 48 40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
